<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser translators rewrite the page text and make React crash (removeChild errors); the portal is already in Portuguese. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060708" />
    <link rel="icon" type="image/png" href="/zentry-logo.png" />
    <!-- Installable app (PWA): clients can put the portal on the home screen / desktop. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zentry Soluções" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap" rel="stylesheet">
    <meta name="description" content="Zentry Soluções — Portal executivo de acompanhamento de processos e inteligência jurídica e financeira." />
    <title>Zentry Soluções — Portal Executivo</title>
    <link rel="preload" as="image" href="/icons/icon-512.png" />
    <!--
      Opening screen, shown once per session (and on every launch of the installed app):
      the gold divider draws itself, the N and the 1 open out from it, "Soluções" comes down,
      a light passes over the gold and the curtain lifts once the portal is ready.
      It lives here, outside React, so it is on screen before the app has loaded.
    -->
    <style>
      .zentry-intro { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #060708; pointer-events: none; }
      .zentry-intro-mark { position: relative; width: min(260px, 62vw); aspect-ratio: 1; overflow: hidden; }
      .zentry-intro-mark img { display: block; width: 100%; height: 100%; animation: zentry-intro-open 1100ms cubic-bezier(.3, .6, .2, 1) both; }
      /* Positions are in the 512px icon: divider at x 54.5–55.5%, letters 19–75% wide, 27–66% tall */
      @keyframes zentry-intro-open {
        0% { clip-path: inset(27% 44.5% 73% 54.5%); }
        35% { clip-path: inset(27% 44.5% 33.6% 54.5%); }
        70% { clip-path: inset(27% 24% 33.6% 18%); }
        100% { clip-path: inset(0 0 0 0); }
      }
      /* The light only touches the gold: the icon itself is the mask (bright letters show it, the dark background does not) */
      .zentry-intro-mark::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(105deg, transparent 38%, rgba(225, 236, 255, .9) 50%, transparent 62%) no-repeat;
        background-size: 250% 100%; background-position: 130% 0;
        -webkit-mask: url(/icons/icon-512.png) center / 100% 100%; mask: url(/icons/icon-512.png) luminance center / 100% 100%;
        mix-blend-mode: overlay; animation: zentry-intro-shine 750ms ease-in-out 1000ms both;
      }
      @keyframes zentry-intro-shine { to { background-position: -30% 0; } }
      /* Leaves when the portal says it is ready (zentry-intro-done); on its own after 6s if that never comes */
      .zentry-intro { animation: zentry-intro-out 450ms cubic-bezier(.2, .7, .2, 1) 6s both; }
      .zentry-intro.zentry-intro-done { animation-delay: 0s; }
      @keyframes zentry-intro-out { to { opacity: 0; visibility: hidden; transform: scale(1.03); } }
    </style>
  </head>
  <body>
    <div class="zentry-intro" id="zentry-intro" aria-hidden="true"><div class="zentry-intro-mark"><img src="/icons/icon-512.png" alt="" /></div></div>
    <script>
      // Only on the first visit of the session, and never with "reduzir movimento".
      (function () {
        var intro = document.getElementById("zentry-intro");
        var seen = false;
        try { seen = sessionStorage.getItem("zentry-intro") === "1"; sessionStorage.setItem("zentry-intro", "1"); } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (seen || reduce) intro.remove();
        else intro.addEventListener("animationend", function (event) { if (event.animationName === "zentry-intro-out") intro.remove(); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
